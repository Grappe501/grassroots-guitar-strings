<body class="spot" data-spot="parking">
<header class="spot-top">
  <p class="eyebrow" id="spotKicker">SPOT</p>
  <h1 id="spotTitle">Your day</h1>
  <p id="spotWho">Name goes here today.</p>
  <p><a href="/spots/">All phone pages</a> · <a href="/v5/">My night</a></p>
</header>
<main class="spot-wrap">
  <article class="spot-now" id="spotNow"></article>
  <article class="spot-facts">
    <p class="eyebrow">THIS SEAT</p>
    <p id="spotWhy"></p>
    <p><b>Arrive</b> — <span id="spotArrive"></span></p>
    <p><b>Eat</b> — <span id="spotEat"></span></p>
    <p><b>Sit</b> — <span id="spotSit"></span></p>
    <p><b>Wear</b> — <span id="spotWear"></span></p>
    <p><b>Shows</b> — <span id="spotShows"></span></p>
    <p class="spot-social"><b>Social</b> — <span id="spotSocial"></span></p>
    <div id="spotPick"></div>
  </article>
  <ol class="spot-clock" id="spotClock"></ol>
</main>

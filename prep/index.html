<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17466b">
  <title>Grassroots & Guitar Strings — Event Prep</title>
  <meta name="description" content="Day-of operations checklist for Grassroots & Guitar Strings, Thursday, September 17, 2026.">
  <link rel="stylesheet" href="/prep/prep.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div>
        <p class="eyebrow">EVENT COMMAND BOARD</p>
        <h1>Grassroots &amp; Guitar Strings</h1>
        <p class="subtitle">Thursday, September 17, 2026 · Woody's Sherwood Forest</p>
      </div>
      <div class="top-actions">
        <button class="btn btn--light" id="printBtn">Print</button>
        <button class="btn btn--gold" id="resetBtn">Reset checklist</button>
      </div>
    </div>
  </header>

  <main class="shell">
    <section class="dashboard" aria-label="Event status">
      <div class="stat"><span class="stat__label">Overall completion</span><strong id="progressPct">0%</strong></div>
      <div class="progress"><div id="progressBar"></div></div>
      <div class="stat"><span class="stat__label">Completed</span><strong id="progressCount">0 / 0</strong></div>
      <div class="critical"><strong>Hard stop:</strong> building cleared by 10:00 PM · show ends about 8:45–9:00 PM · strike starts immediately.</div>
    </section>

    <nav class="tabs" role="tablist" aria-label="Event preparation sections">
      <button class="tab is-active" role="tab" aria-selected="true" data-tab="overview">Overview</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="ben">Ben / BBQ</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="setup">Setup</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="volunteers">Volunteers</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="tickets">Tickets</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="campaign">Campaign</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="food">Food &amp; Drinks</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="production">Sound &amp; Show</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="timeline">Timeline</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="breakdown">Breakdown</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="final">Final Sweep</button>
    </nav>

    <div id="tabContent"></div>
  </main>

  <template id="taskTemplate">
    <div class="task">
      <label class="check"><input type="checkbox" class="task-check"><span class="checkmark" aria-hidden="true"></span><span class="task-text"></span></label>
      <input class="owner" type="text" placeholder="Assigned to…" aria-label="Assigned to">
      <input class="when" type="text" placeholder="When…" aria-label="When">
    </div>
  </template>

  <script src="/prep/prep.js"></script>
</body>
</html>

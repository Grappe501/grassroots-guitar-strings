[build]
  publish = "."
  command = "echo Static site — no build step"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/host-a-table"
  to = "/host-a-table/"
  status = 301

[[redirects]]
  from = "/tickets"
  to = "/tickets/"
  status = 301

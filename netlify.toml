[build]
  publish = "."
  command = "echo Static site — no build step"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/host-a-table"
  to = "/host-a-table/"
  status = 301

[[redirects]]
  from = "/tickets"
  to = "/tickets/"
  status = 301

[[redirects]]
  from = "/run"
  to = "/clock/"
  status = 302

[[redirects]]
  from = "/run/"
  to = "/clock/"
  status = 302

[[redirects]]
  from = "/day"
  to = "/spots/"
  status = 302

[[redirects]]
  from = "/day/"
  to = "/spots/"
  status = 302

[[redirects]]
  from = "/night"
  to = "/v5/"
  status = 302

[[redirects]]
  from = "/night/"
  to = "/v5/"
  status = 302
